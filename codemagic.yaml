# CoursePet iOS - Codemagic 构建配置
# 策略：构建"未签名 IPA"（不依赖证书/Team ID），下载后用 AltStore 在 Windows 上签名安装

workflows:
  ios-workflow:
    name: CoursePet iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      # GitHub Release 上传凭据：变量组在 Codemagic 应用设置 → Environment variables 里维护（含 GH_TOKEN）
      groups:
        - github_credentials

    scripts:
      # 1. 安装 XcodeGen（从 project.yml 生成 .xcodeproj）
      - name: 安装 XcodeGen
        script: brew install xcodegen

      # 2. 生成 Xcode 工程（自动拉取 SSZipArchive 依赖）
      - name: 生成 Xcode 工程
        script: |
          cd ios
          xcodegen generate

      # 2.5 注入构建号（时间戳写入版本号）：设置页"数据"分组可见，
      #     用来一眼识别手机上装的到底是哪次构建的包（排查"装没装对包"）
      - name: 注入构建号
        script: |
          BUILD_ID=$(date +%Y%m%d-%H%M)
          plutil -replace CFBundleVersion -string "$BUILD_ID" ios/CoursePet/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.0 ($BUILD_ID)" ios/CoursePet/Info.plist
          echo "== 本次构建号: $BUILD_ID =="

      # 3. 构建（免签名；用 build 而非 archive，产物路径更可靠）
      - name: 构建 App（免签名）
        script: |
          cd ios
          mkdir -p ../build
          set -o pipefail
          xcodebuild \
            -project CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derived \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ../build/build.log | tail -3
          rc=$?
          echo "════════ 编译错误摘要（把下面这些发我）════════"
          grep -E "error:" ../build/build.log | sort -u | head -50
          exit $rc

      # 4. 打包为未签名 IPA（Payload 结构）
      - name: 打包 IPA
        script: |
          APP=build/derived/Build/Products/Release-iphoneos/CoursePet.app
          test -d "$APP" || { echo "ERROR: 未找到 CoursePet.app"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf build/Payload build/CoursePet-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          echo "== App 大小 =="
          du -sh build/Payload/CoursePet.app
          cd build
          zip -qry CoursePet-unsigned.ipa Payload
          echo "== IPA 内容预览 =="
          unzip -l CoursePet-unsigned.ipa | head -20

      # 5. 构建模拟器版本（供 Appetize.io 在浏览器中运行预览）
      - name: 构建模拟器版本
        script: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ../build/derived-sim \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ../build/build-sim.log | tail -3
          rc=$?
          echo "════════ 模拟器构建错误摘要 ════════"
          grep -E "error:" ../build/build-sim.log | sort -u | head -30
          [ $rc -eq 0 ] || exit $rc
          cd ../build/derived-sim/Build/Products/Release-iphonesimulator
          zip -qry ../../../../../build/CoursePet-simulator.zip CoursePet.app
          echo "== 模拟器包完成 =="

    artifacts:
      - build/CoursePet-unsigned.ipa
      - build/CoursePet-simulator.zip

    # 构建成功后自动把 IPA 发布到 GitHub Release，
    # SideStore 用固定直链更新（永远指向最新一次成功构建）：
    # https://github.com/Zhr65/coursepet-ios/releases/latest/download/CoursePet.ipa
    publishing:
      scripts:
        - name: 发布 IPA 到 GitHub Release
          script: |
            set -e
            if [ -z "$GH_TOKEN" ]; then
              echo "ERROR: GH_TOKEN 环境变量为空，检查 Codemagic 环境变量组 github_credentials"
              exit 1
            fi
            cd build
            test -f CoursePet-unsigned.ipa || { echo "ERROR: 未找到 IPA 产物"; exit 1; }
            export RELEASE_TAG="build-$(date +%Y%m%d-%H%M%S)"
            python3 << 'PYEOF'
            import json, os, urllib.request

            token = os.environ["GH_TOKEN"]
            tag = os.environ["RELEASE_TAG"]
            repo = "Zhr65/coursepet-ios"
            fixed_link = f"https://github.com/{repo}/releases/latest/download/CoursePet.ipa"
            headers = {
                "Authorization": f"token {token}",
                "Accept": "application/vnd.github+json",
                "User-Agent": "codemagic-release",
            }

            # 1. 创建 Release（非草稿、非预发布，才能被 latest 链接命中）
            body = json.dumps({
                "tag_name": tag,
                "name": f"CoursePet 构建 {tag}",
                "body": f"自动构建产物（未签名 IPA，用 SideStore 等工具本地签名安装）\n\nSideStore 固定更新链接：{fixed_link}",
                "draft": False,
                "prerelease": False,
            }).encode()
            req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", data=body, headers=headers, method="POST")
            with urllib.request.urlopen(req) as resp:
                release = json.load(resp)
            print("Release 已创建:", release["html_url"])

            # 2. 上传 IPA，统一命名 CoursePet.ipa（保证固定直链永远有效）
            upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release['id']}/assets?name=CoursePet.ipa"
            with open("CoursePet-unsigned.ipa", "rb") as f:
                ipa = f.read()
            req = urllib.request.Request(upload_url, data=ipa,
                                         headers={**headers, "Content-Type": "application/octet-stream"},
                                         method="POST")
            with urllib.request.urlopen(req) as resp:
                asset = json.load(resp)
            print("IPA 已上传:", asset["browser_download_url"])
            print("SideStore 固定更新链接:", fixed_link)
            PYEOF
