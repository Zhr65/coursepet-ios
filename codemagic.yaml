# CoursePet iOS - Codemagic 构建配置
# 策略：构建"未签名 IPA"（不依赖证书/Team ID），下载后用 AltStore 在 Windows 上签名安装

workflows:
  ios-workflow:
    name: CoursePet iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      # 1. 安装 XcodeGen（从 project.yml 生成 .xcodeproj）
      - name: 安装 XcodeGen
        script: brew install xcodegen

      # 2. 生成 Xcode 工程（自动拉取 SSZipArchive 依赖）
      - name: 生成 Xcode 工程
        script: |
          cd ios
          xcodegen generate

      # 3. 构建（免签名，避免证书配置问题）
      - name: 构建 Archive
        script: |
          cd ios
          xcodebuild \
            -project CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/CoursePet.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      # 4. 打包为未签名 IPA（Payload 结构）
      - name: 打包 IPA
        script: |
          mkdir -p build/Payload
          cp -R build/CoursePet.xcarchive/Products/Applications/CoursePet.app build/Payload/
          cd build
          zip -qry CoursePet-unsigned.ipa Payload

    artifacts:
      - build/CoursePet-unsigned.ipa
