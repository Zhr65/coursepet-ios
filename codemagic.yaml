# CoursePet iOS - 使用 Xcode 直接构建（无需 XcodeGen）
# 步骤：Python 生成 xcodeproj → xcodebuild 编译 → 导出 IPA

workflows:
  ios-workflow:
    name: CoursePet iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.coursepet.app"
        APP_GROUP: "group.com.coursepet.app"
      groups:
        - appstore

    scripts:
      # 1. 用 Python 生成 Xcode 工程
      - name: 生成 Xcode 工程
        script: |
          python3 scripts/generate_xcodeproj.py

      # 2. 设置代码签名环境变量
      - name: 配置签名
        script: |
          cd ios/CoursePet.xcodeproj
          # 更新 Bundle ID
          sed -i '' 's/com.coursepet.app/com.coursepet.app/g' project.pbxproj

      # 3. 构建 Archive
      - name: 构建 Archive
        script: |
          xcodebuild \
            -project ios/CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CoursePet.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            | xcpretty

      # 4. 导出 IPA
      - name: 导出 IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/CoursePet.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export.plist \
            | xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.dSYM
