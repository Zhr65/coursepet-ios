# CoursePet iOS - Codemagic 构建配置
# 策略：构建"未签名 IPA"（不依赖证书/Team ID），下载后用 AltStore 在 Windows 上签名安装

workflows:
  ios-workflow:
    name: CoursePet iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      # 1. 安装 XcodeGen（从 project.yml 生成 .xcodeproj）
      - name: 安装 XcodeGen
        script: brew install xcodegen

      # 2. 生成 Xcode 工程（自动拉取 SSZipArchive 依赖）
      - name: 生成 Xcode 工程
        script: |
          cd ios
          xcodegen generate

      # 3. 构建（免签名；用 build 而非 archive，产物路径更可靠）
      - name: 构建 App（免签名）
        script: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derived \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      # 4. 打包为未签名 IPA（Payload 结构）
      - name: 打包 IPA
        script: |
          APP=build/derived/Build/Products/Release-iphoneos/CoursePet.app
          test -d "$APP" || { echo "ERROR: 未找到 CoursePet.app"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf build/Payload build/CoursePet-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          echo "== App 大小 =="
          du -sh build/Payload/CoursePet.app
          cd build
          zip -qry CoursePet-unsigned.ipa Payload
          echo "== IPA 内容预览 =="
          unzip -l CoursePet-unsigned.ipa | head -20

    artifacts:
      - build/CoursePet-unsigned.ipa
