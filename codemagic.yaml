# CoursePet iOS - Codemagic 构建配置
# 修改后推送到 GitHub，Codemagic 会自动触发构建

workflows:
  ios-workflow:
    name: CoursePet iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.coursepet.app"
        APP_GROUP: "group.com.coursepet.app"
      groups:
        - appstore

    scripts:
      # 1. 安装 XcodeGen（用于从 project.yml 生成 .xcodeproj）
      - name: 安装 XcodeGen
        script: |
          brew install xcodegen

      # 2. 生成 Xcode 工程（会自动拉取 SSZipArchive Swift Package 依赖）
      - name: 生成 Xcode 工程
        script: |
          cd ios
          xcodegen generate --type project

      # 3. 构建 archive（自动签名）
      - name: 构建 Archive
        script: |
          cd ios
          xcodebuild \
            -project CoursePet.xcodeproj \
            -scheme CoursePet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/CoursePet.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            | xcpretty

      # 4. 导出 IPA
      - name: 导出 IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath ios/../build/CoursePet.xcarchive \
            -exportPath ../build/ios/ipa \
            -exportOptionsPlist ../export.plist \
            | xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.dSYM
      - '*.log'

    notification:
      email:
        recipients:
          - 你的邮箱@example.com   # ← 替换为你的邮箱
        on_build:
          success: true
          failure: true
