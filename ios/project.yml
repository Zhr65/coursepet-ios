# CoursePet iOS 项目配置（XcodeGen）
# 使用方式：安装 xcodegen 后运行 `xcodegen generate`
#
# 架构说明：不使用独立的 Shared framework target，而是把 Shared/ 下的
# 源文件直接编译进主 App、Widget、LiveActivity 三个 target（同一份代码
# 三个二进制各编译一份），避免框架链接/嵌入等复杂问题。

name: CoursePet
options:
  bundleIdPrefix: com.coursepet
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic

targets:
  # ════════════════════════════════════════════════════════════
  # 主 App Target
  # ════════════════════════════════════════════════════════════
  CoursePet:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePet
      - path: Shared
    dependencies:
      - target: CoursePetWidgets
        embed: true
      - target: CoursePetLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app
        INFOPLIST_FILE: CoursePet/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePet/CoursePet.entitlements
        ENABLE_PREVIEWS: YES

  # ════════════════════════════════════════════════════════════
  # Widget 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.widgets
        INFOPLIST_FILE: CoursePetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePetWidgets/CoursePetWidgets.entitlements

  # ════════════════════════════════════════════════════════════
  # Live Activity 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.liveactivity
        INFOPLIST_FILE: CoursePetLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePetLiveActivity/CoursePetLiveActivity.entitlements

# ════════════════════════════════════════════════════════════
# Scheme（命令行构建必需）
# ════════════════════════════════════════════════════════════
schemes:
  CoursePet:
    build:
      targets:
        CoursePet: all
    run:
      config: Debug
    archive:
      config: Release
