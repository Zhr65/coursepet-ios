# CoursePet iOS 项目配置（XcodeGen）
# 使用方式：安装 xcodegen 后运行 `xcodegen generate`

name: CoursePet
options:
  bundleIdPrefix: com.coursepet
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic

packages:
  # Excel 解析库（用于导入 .xlsx 课表文件）
  SSZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    from: 2.3.0

targets:
  # ════════════════════════════════════════════════════════════
  # 共享模块（静态库，主 App / Widget / LiveActivity 共同链接）
  # ════════════════════════════════════════════════════════════
  Shared:
    type: library
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Shared
    dependencies:
      - package: SSZipArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.shared
        SKIP_INSTALL: YES

  # ════════════════════════════════════════════════════════════
  # 主 App Target
  # ════════════════════════════════════════════════════════════
  CoursePet:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePet
    dependencies:
      - target: Shared
      - target: CoursePetWidgets
        embed: true
      - target: CoursePetLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app
        INFOPLIST_FILE: CoursePet/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePet/CoursePet.entitlements
        ENABLE_PREVIEWS: YES

  # ════════════════════════════════════════════════════════════
  # Widget 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetWidgets
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.widgets
        INFOPLIST_FILE: CoursePetWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePetWidgets/CoursePetWidgets.entitlements

  # ════════════════════════════════════════════════════════════
  # Live Activity 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetLiveActivity
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.liveactivity
        INFOPLIST_FILE: CoursePetLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoursePetLiveActivity/CoursePetLiveActivity.entitlements

# ════════════════════════════════════════════════════════════
# Scheme（命令行构建必需）
# ════════════════════════════════════════════════════════════
schemes:
  CoursePet:
    build:
      targets:
        CoursePet: all
        CoursePetWidgets: all
        CoursePetLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release
