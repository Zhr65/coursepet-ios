# CoursePet iOS 项目配置（XcodeGen）
# 使用方式：安装 xcodegen 后运行 `xcodegen generate`
# 或直接双击打开 .xcodeproj

settings:
  base:
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.9"
    deploymentTarget:
      ios: "16.1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_OBJC_BRIDGING_HEADER: ""

packages:
  # Excel 解析库（用于导入 .xlsx 课表文件）
  SSZipArchive:
    url: https://github.com/ZipArchive/ZipArchive.git
    requirement:
      branch: master

targets:
  # ════════════════════════════════════════════════════════════
  # 主 App Target
  # ════════════════════════════════════════════════════════════
  CoursePet:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePet
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app  # ← 改为 com.你的名字.coursepet 更规范
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""  # 填入你的 Team ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: CoursePet/Info.plist
        ENTITLEMENTS_FILE: CoursePet/CoursePet.entitlements
        APP_GROUP_IDENTIFIER: "group.com.coursepet.app"
    dependencies:
      - target: Shared
      - package: SSZipArchive
    files:
      - path: CoursePet/Assets.xcassets
        type: folder
        fileEncoding: 4

  # ════════════════════════════════════════════════════════════
  # 共享模块（Model + DataManager + WeekMath + PetStateMachine + PetUIView）
  # ════════════════════════════════════════════════════════════
  Shared:
    type: framework
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.shared
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SDKROOT)/usr/lib/swift"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  # ════════════════════════════════════════════════════════════
  # Widget 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetWidgets
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""  # 填入你的 Team ID
        INFOPLIST_FILE: CoursePetWidgets/Info.plist
        ENTITLEMENTS_FILE: CoursePetWidgets/CoursePetWidgets.entitlements
        APP_GROUP_IDENTIFIER: "group.com.coursepet.app"
    dependencies:
      - target: Shared

  # ════════════════════════════════════════════════════════════
  # Live Activity 扩展 Target
  # ════════════════════════════════════════════════════════════
  CoursePetLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: CoursePetLiveActivity
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coursepet.app.liveactivity
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""  # 填入你的 Team ID
        INFOPLIST_FILE: CoursePetLiveActivity/Info.plist
        ENTITLEMENTS_FILE: CoursePetLiveActivity/CoursePetLiveActivity.entitlements
        APP_GROUP_IDENTIFIER: "group.com.coursepet.app"
    dependencies:
      - target: Shared

# ════════════════════════════════════════════════════════════
# 项目组（Group）
# ════════════════════════════════════════════════════════════
groups:
  - ios
  - ios/Shared
  - ios/CoursePet
  - ios/CoursePet/Views
  - ios/CoursePet/Import
  - ios/CoursePet/Assets.xcassets
  - ios/CoursePetWidgets
  - ios/CoursePetLiveActivity
